# ============================================================
# Local hardening override — kept separate from supabase-stack/ so a
# future `cp -r supabase/docker supabase-stack` (version bump) doesn't
# silently drop it.
#
# Binds every port that only needs to be reachable from this host
# (Caddy, or nothing at all) to 127.0.0.1 instead of 0.0.0.0. Without
# this, Postgres (5432), the transaction pooler (6543) and Kong
# (8000/8443) are open to the entire internet — protected only by
# POSTGRES_PASSWORD / the anon+service JWTs, with no firewall in front
# (ufw is inactive on this VPS and Docker's own iptables rules bypass
# it anyway).
#
# Public access still works exactly the same: Caddy reverse-proxies
# 127.0.0.1:8000 (Kong) and 127.0.0.1:3000 (app) out to 443.
# ============================================================

services:
  supavisor:
    ports: !override
      - '127.0.0.1:${POSTGRES_PORT}:5432'
      - '127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543'

  api-gw:
    ports: !override
      - '127.0.0.1:${API_GW_HTTP_PORT:-${KONG_HTTP_PORT:-8000}}:8000/tcp'
      - '127.0.0.1:${KONG_HTTPS_PORT:-8443}:8443/tcp'

  app:
    ports: !override
      - '127.0.0.1:${HOST_PORT:-3000}:3000'

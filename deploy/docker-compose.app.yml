# ============================================================
# iMasterChat on a VPS that also runs a self-hosted Supabase.
#
# This file adds ONLY the app. The Supabase stack (db, auth, rest,
# realtime, storage, kong, studio) comes from the official
# supabase/docker compose — see deploy/README.md. Keeping them in two
# files means a Supabase version bump is a `git pull` in their repo,
# not a merge conflict in ours.
#
# Run both together from the repo root:
#   docker compose -f supabase/docker/docker-compose.yml \
#                  -f deploy/docker-compose.app.yml up -d
#
# ⚠ NEXT_PUBLIC_SUPABASE_URL must be the PUBLIC https URL of your Kong
# gateway (e.g. https://api.seudominio.com.br), never http://kong:8000.
# It is inlined into the JavaScript bundle at build time and runs in
# the visitor's browser, which cannot resolve Docker service names.
# The server-side code in the container uses the same variable, so that
# public hostname must also resolve from inside the container — see the
# `extra_hosts` note in deploy/README.md if your DNS doesn't loop back.
# ============================================================

services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-pt-BR}
        # Derivado de META_APP_ID de propósito, e não de uma variável
        # NEXT_PUBLIC_ própria: o App ID não é segredo (ele aparece na
        # URL do popup do Facebook), e pedir o mesmo número duas vezes
        # no .env garante que uma hora as duas cópias divergem. Quando
        # divergem, o sintoma é o popup do Cadastro Incorporado não
        # abrir, sem erro em log nenhum.
        NEXT_PUBLIC_META_APP_ID: ${META_APP_ID:-}
        NEXT_PUBLIC_META_ES_CONFIG_ID: ${NEXT_PUBLIC_META_ES_CONFIG_ID:-}
        # Build arg, e não só runtime: o painel de notificações é
        # `'use client'`, então a chave precisa estar inlined no bundle.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    environment:
      PORT: 3000
      # ANON_KEY / SERVICE_ROLE_KEY come from the Supabase stack's .env,
      # so the two composes share one source of truth for the JWTs.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_APP_SECRET: ${META_APP_SECRET}
      META_APP_ID: ${META_APP_ID:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_BILLING_CONTACT: ${NEXT_PUBLIC_BILLING_CONTACT:-}
      NEXT_PUBLIC_BILLING_PIX_KEY: ${NEXT_PUBLIC_BILLING_PIX_KEY:-}
      NEXT_PUBLIC_BILLING_PIX_QR: ${NEXT_PUBLIC_BILLING_PIX_QR:-}
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET:-}
      NEXT_PUBLIC_META_ES_CONFIG_ID: ${NEXT_PUBLIC_META_ES_CONFIG_ID:-}

      # Hostnames que podem aparecer num link de convite. Sem isto, um
      # convite gerado por trás de proxy pode sair com a origem errada.
      ALLOWED_INVITE_HOSTS: ${ALLOWED_INVITE_HOSTS:-}

      # O relógio do container. Ele NÃO substitui o fuso da conta (esse
      # fica em Configurações → Agendamento) — mas governa o carimbo dos
      # logs, e depurar um agendamento com log em UTC e agenda em BRT
      # custa meia hora toda vez.
      TZ: ${TZ:-America/Sao_Paulo}

      # --- Transcrição de áudio local (migração 061) ---
      # Só é lida quando a conta escolhe "Whisper na VPS" em Agentes →
      # Regras. Quem usa ElevenLabs, ou não usa áudio, deixa vazio.
      #
      # SEM VALOR PADRÃO, de propósito. Isto já foi
      # `${WHISPER_URL:-http://whisper:9000}` e o padrão era uma
      # armadilha: numa máquina que não subiu o perfil `whisper`, a
      # variável chegava preenchida apontando para um serviço que não
      # existe. Quem inspecionasse o container veria "configurado" e o
      # áudio falharia na primeira tentativa real — com o app caindo no
      # aviso "não consegui ouvir", que é indistinguível de transcrição
      # ruim.
      #
      # Vazia, o código diz o que está acontecendo:
      # "[audio] provedor local escolhido sem WHISPER_URL".
      WHISPER_URL: ${WHISPER_URL:-}

      # --- Push / PWA (migração 051) ---
      # A pública aparece aqui E como build arg de propósito: o
      # `send.ts` do servidor lê a mesma variável.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

      # --- Alertas ao operador (migração 052) ---
      # Sem estas duas nada quebra: os eventos continuam gravados e a
      # tela /admin → Eventos continua funcionando. Só não sai aviso.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}

      # --- Google Agenda (migração 043) ---
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    # SEM `depends_on`, de propósito.
    #
    # Ele apontava para o serviço `kong`. O stack do Supabase renomeou o
    # gateway para `api-gw` — o `docker-compose.kong.yml` apenas o
    # substitui em cima, preservando `kong` como ALIAS DE REDE. Ou seja:
    # `kong` continua resolvendo por DNS, mas não existe mais como nome
    # de serviço, e o compose recusa o projeto inteiro com
    # "depends on undefined service kong".
    #
    # Apontar para `api-gw` só moveria o problema para a próxima
    # renomeação, e quebraria quem ainda roda o stack antigo.
    #
    # Nada se perde: isto nunca foi garantia de prontidão, só ordem — e
    # o app tolera um Supabase momentaneamente fora (a requisição falha e
    # é refeita). O que realmente precisa esperar são as migrações, e o
    # `deploy/apply-migrations.sh` já espera sozinho.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================
  # The scheduler.
  #
  # Three endpoints need calling on a schedule, and two of them are not
  # optional:
  #
  #   /api/automations/cron   automations with a wait never resume
  #   /api/flows/cron         an abandoned run holds
  #                           idx_one_active_run_per_contact forever and
  #                           blocks every future trigger for that contact
  #   /api/ai/vault/keeper    the vault stops learning
  #   /api/exchange/cron      the BRL figure ages silently
  #   /api/health/cron        broken accounts are only found on use
  #
  # It ships here rather than as a host crontab so a deploy is one
  # `docker compose up` and not a set of instructions somebody follows
  # differently on each machine. It reaches the app by service name, so
  # nothing has to be publicly routable and the secret never crosses the
  # internet.
  #
  # A sleep loop, not crond: one file, no crontab syntax inside YAML,
  # and a schedule this coarse gains nothing from cron's precision.
  # ============================================================
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET:-}
      # Seconds between sweeps of the two time-critical endpoints.
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-300}
      # How many of those ticks pass between keeper runs. The keeper only
      # looks at conversations idle for 90 minutes, so every 30 is ample
      # — and each run spends the account's own provider key.
      KEEPER_EVERY_TICKS: ${KEEPER_EVERY_TICKS:-6}
      # Contador proprio, e nao carona no do keeper: a ronda de saude
      # sonda a chave de IA de contas paradas, e cada sondagem e uma
      # chamada paga ao provedor. Com o padrao de 300s, 12 ticks = 1h,
      # que e o que o codigo documenta e o que a tela de admin espera
      # (ela acusa "atrasado" depois de 2h). Na carona do keeper eram
      # 30 minutos, o dobro de sondagens do combinado.
      HEALTH_EVERY_TICKS: ${HEALTH_EVERY_TICKS:-12}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$AUTOMATION_CRON_SECRET" ]; then
          echo "[cron] AUTOMATION_CRON_SECRET is empty — the endpoints would answer 503."
          echo "[cron] Set it in .env and restart. Sleeping instead of spinning."
          while true; do sleep 3600; done
        fi
        echo "[cron] every $${CRON_INTERVAL_SECONDS}s; keeper every $${KEEPER_EVERY_TICKS}; health every $${HEALTH_EVERY_TICKS}"
        tick=0
        while true; do
          # `|| true` on every call: one endpoint failing must not kill
          # the loop and take the other two down with it.
          curl -fsS -m 120 -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
            http://app:3000/api/automations/cron >/dev/null || echo "[cron] automations failed"
          curl -fsS -m 120 -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
            http://app:3000/api/flows/cron >/dev/null || echo "[cron] flows failed"
          tick=$$((tick + 1))
          if [ $$((tick % $${KEEPER_EVERY_TICKS})) -eq 0 ]; then
            # The dollar moves daily; refreshing beside the keeper is far
            # more often than needed and costs one request.
            curl -fsS -m 30 -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
              http://app:3000/api/exchange/cron >/dev/null || echo "[cron] exchange failed"
            # Longer timeout: the keeper makes provider calls for up to
            # ten conversations, sequentially and on purpose.
            curl -fsS -m 900 -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
              http://app:3000/api/ai/vault/keeper >/dev/null || echo "[cron] keeper failed"
          fi
          # A ronda de saude: bate na porta de cada dependencia antes de
          # o cliente bater na nossa. Sem ela, a chave da IA que vence de
          # madrugada so vira problema na segunda de manha.
          if [ $$((tick % $${HEALTH_EVERY_TICKS})) -eq 0 ]; then
            curl -fsS -m 600 -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
              http://app:3000/api/health/cron >/dev/null || echo "[cron] health failed"
          fi
          sleep $${CRON_INTERVAL_SECONDS}
        done

  # ============================================================
  # Transcrição de áudio na própria máquina — OPCIONAL.
  #
  # Fica atrás de um profile porque a maioria dos deploys não precisa
  # dele: só sobe quem escolher "Whisper na VPS" em Agentes → Regras.
  # Quem usa ElevenLabs paga por minuto e não gasta CPU; quem não trata
  # áudio não gasta nada.
  #
  #   docker compose ... --profile whisper up -d
  #
  # A razão de existir, quando a ElevenLabs faz o mesmo por API: o áudio
  # do cliente NÃO SAI DA MÁQUINA. Para conversa de paciente, de
  # contrato ou de cobrança, isso costuma ser o argumento inteiro.
  #
  # A troca é CPU. Uma transcrição usa o que puder pegar, por isso o
  # limite abaixo — sem ele, um áudio longo compete com o app pelo
  # processador e a inbox trava para todo mundo enquanto transcreve.
  #
  # Não publica porta: o app o alcança por nome de serviço. Ele não tem
  # autenticação nenhuma, então expô-lo no proxy é entregar transcrição
  # grátis para a internet — se algum dia precisar, ponha auth antes.
  # ============================================================
  whisper:
    profiles: ['whisper']
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      # faster-whisper (CTranslate2), não o whisper original: em CPU é
      # várias vezes mais rápido para a mesma qualidade, e é a única
      # razão de isto ser viável sem GPU.
      ASR_ENGINE: faster_whisper
      # `small` é o equilíbrio para português falado ao celular.
      # `base` erra nome próprio e número demais para agendamento;
      # `medium` triplica tempo e memória sem ganho proporcional.
      ASR_MODEL: small
      # 8 bits: metade da memória, com diferença que não aparece em
      # áudio de WhatsApp — que já chega comprimido.
      ASR_QUANTIZATION: int8
      ASR_MODEL_PATH: /data/whisper
    volumes:
      # O modelo baixa uma vez, ~500 MB. Sem o volume, toda recriação
      # baixa de novo e o primeiro áudio depois do deploy demora
      # minutos — que o cliente lê como "parou de responder".
      - whisper-models:/data/whisper
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    healthcheck:
      # `/docs` é a interface do FastAPI e responde assim que o serviço
      # sobe. O modelo carrega na PRIMEIRA transcrição, não aqui — então
      # "healthy" não quer dizer "pronto para o primeiro áudio".
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/docs').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  whisper-models:
